<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X32 Auto-Director</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0c0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Director">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<!-- Fonts (graceful fallback to system when offline) -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>
</head>
<body>

<div class="app">
  <div class="accent-rail" id="accent-rail"></div>

  <header class="hdr">
    <div class="hdr-brand">
      <div class="hdr-logo">X32</div>
      <div class="hdr-title">Auto-Director</div>
    </div>

    <div class="seg big">
      <button class="segbtn" id="tg-live" data-screen="live">LIVE</button>
      <button class="segbtn" id="tg-setup" data-screen="setup">SETUP</button>
    </div>

    <div class="hdr-sep"></div>

    <div class="hdr-cluster">
      <span class="lbl-sm">ENGINE</span>
      <div class="seg">
        <button class="segbtn" id="tg-auto">AUTO</button>
        <button class="segbtn" id="tg-manual">MANUAL</button>
      </div>
    </div>

    <div class="hdr-cluster">
      <span class="lbl-sm">PLANNER</span>
      <div class="seg">
        <button class="segbtn" id="tg-rules">RULES</button>
        <button class="segbtn" id="tg-dynamic">DYNAMIC</button>
      </div>
    </div>

    <div class="hdr-cluster">
      <span class="lbl-sm">PACE</span>
      <div class="seg">
        <button class="segbtn" id="tg-fast">빠름</button>
        <button class="segbtn" id="tg-normal">보통</button>
        <button class="segbtn" id="tg-slow">느림</button>
      </div>
      <span class="hdr-beat" id="beat-readout">— BPM</span>
    </div>

    <div class="grow"></div>

    <div class="hdr-status">
      <span class="hdr-dot" id="x32-dot"></span>
      <span id="x32-text">연결 중…</span>
      <span style="color:var(--mut3)">·</span>
      <span id="fps-text">— fps</span>
    </div>

    <div class="hdr-project" id="project-btn">
      <span class="lbl-sm">PROJECT</span>
      <span style="font-weight:600" id="project-name">—</span>
      <span style="color:var(--mut2); font-size:9px">▾</span>
      <div class="project-menu hidden" id="project-menu"></div>
    </div>

    <div class="hdr-cluster" style="padding-left:2px">
      <span class="lbl-sm">OUTPUT</span>
      <div class="seg">
        <button class="segbtn" id="tg-dry">DRY</button>
        <button class="segbtn" id="tg-send">LIVE</button>
      </div>
      <span class="hdr-out-status" id="out-status">—</span>
    </div>
  </header>

  <div class="audio-alarm hidden" id="audio-alarm"></div>

  <!-- LIVE screen: built once by buildLiveShell(), updated per WS tick -->
  <main class="screen-live" id="screen-live"></main>

  <!-- SETUP screen -->
  <main class="screen-setup hidden" id="screen-setup">
    <nav class="setup-nav" id="setup-nav"></nav>
    <div class="pane" id="setup-pane"></div>
  </main>

  <div id="modal-root"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
